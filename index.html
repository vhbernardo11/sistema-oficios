<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema de Ofícios</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;padding:20px}.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:12px;padding:30px;box-shadow:0 2px 8px rgba(0,0,0,.1)}h1{color:#1a73e8;margin-bottom:20px}.status{padding:15px;background:#e7f3ff;border-left:4px solid #1a73e8;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}@media(max-width:768px){.grid{grid-template-columns:1fr}}.form-group{margin-bottom:15px}label{display:block;margin-bottom:5px;font-weight:500;color:#555}input,textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}textarea{min-height:100px;resize:vertical}button{background:#1a73e8;color:#fff;border:none;padding:12px 24px;border-radius:6px;cursor:pointer;font-size:14px;margin-right:10px}button:hover{background:#1557b0}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#6c757d}.danger{background:#dc3545}.list{margin-top:30px}.item{background:#f8f9fa;padding:15px;border-radius:8px;margin-bottom:10px;border-left:4px solid #1a73e8}.item h3{color:#333;margin-bottom:8px}.item p{color:##666;font-size:14px}.item-actions{margin-top:10px}#loading{text-align:center;padding:40px;color:#666}input[type="file"]{display:none}</style></head><body><div class="container"><h1>🏛️ Sistema de Ofícios - Online</h1><div class="status" id="status">Conectando ao Supabase...</div><div class="grid"><div><div class="form-group"><label>Número</label><input type="number" id="numero" min="1" max="999" placeholder="Automático"></div><div class="form-group"><label>Ano</label><input type="number" id="ano" value="2026"></div></div><div><div class="form-group"><label>Descrição</label><textarea id="descricao" placeholder="Assunto do ofício"></textarea></div></div></div><div><button onclick="salvar()">💾 Salvar</button><button onclick="document.getElementById('fileInput').click()" class="secondary">📎 Anexar Word</button><input type="file" id="fileInput" accept=".docx" onchange="anexarArquivo()"><button onclick="listar()" class="secondary">🔄 Atualizar</button></div><div class="list"><h2>Ofícios Registrados</h2><div id="lista"><div id="loading">Carregando...</div></div></div></div><script>const SUPABASE_URL='https://lkstpkimcamlyxrjdshz.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxrc3Rwa2ltY2FtbHl4cmpkc2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzk4ODUsImV4cCI6MjA5MjYxNTg4NX0.pRI6hXgRZG5MiRllO-myezU2wu1RXICCqcGf2m-uEHM';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentFile=null;async function init(){try{const{data,error}=await sb.from('oficios').select('*').limit(1);if(error)throw error;document.getElementById('status').innerHTML='✅ Conectado ao Supabase (São Paulo, Brasil)';listar()}catch(e){document.getElementById('status').innerHTML='❌ Erro: '+e.message}}async function proximoNumero(ano){const{data}=await sb.rpc('proximo_numero',{p_year:ano});return data||1}async function salvar(){const ano=parseInt(document.getElementById('ano').value);const desc=document.getElementById('descricao').value.trim();if(!desc){alert('Preencha a descrição');return}let numero=parseInt(document.getElementById('numero').value);if(!numero){numero=await proximoNumero(ano)}try{const{data,error}=await sb.from('oficios').insert({numero,year:ano,descricao:desc}).select().single();if(error)throw error;if(currentFile){await uploadArquivo(data.id,currentFile)}alert('✅ Ofício '+numero.toString().padStart(3,'0')+'/'+ano+' salvo!');document.getElementById('descricao').value='';document.getElementById('numero').value='';currentFile=null;listar()}catch(e){alert('Erro: '+e.message)}}function anexarArquivo(){const file=document.getElementById('fileInput').files[0];if(file){currentFile=file;alert('📎 Arquivo anexado: '+file.name)}}async function uploadArquivo(oficioId,file){const path=oficioId+'/'+Date.now()+'.docx';const{error}=await sb.storage.from('documentos-oficios').upload(path,file);if(error)throw error;await sb.from('versoes').insert({oficio_id:oficioId,v:1,name:file.name,size:file.size,storage_path:path})}async function listar(){try{const{data,error}=await sb.from('oficios').select('*').order('year',{ascending:false}).order('numero',{ascending:false}).limit(50);if(error)throw error;const html=data.map(o=>`<div class="item"><h3>Ofício ${o.numero.toString().padStart(3,'0')}/${o.year}</h3><p>${o.descricao}</p><p style="font-size:12px;color:#999;margin-top:5px">Criado em ${new Date(o.created_at).toLocaleString('pt-BR')}</p></div>`).join('');document.getElementById('lista').innerHTML=html||'<p>Nenhum ofício registrado</p>'}catch(e){document.getElementById('lista').innerHTML='Erro: '+e.message}}init();</script></body></html>
