name: Store LTX Cat 10s

on:
  push:
    paths:
      - '.github/workflows/generate-h3-cat-10s.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  store-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download generated LTX-2.5 MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://rioshiina-ltx-2-5.hf.space/gradio_api/file=/tmp/gradio/bcce17c7a1a64128de2d3886240cbee4eb6d6dbb3c5c4173c5620445a82f4da8/LTX2.5_1788204895_t2v_00001_.mp4' \
            -o generated/gato_comendo_lasanha_ultrarealista_10s.mp4
          test -s generated/gato_comendo_lasanha_ultrarealista_10s.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 generated/gato_comendo_lasanha_ultrarealista_10s.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gato-comendo-lasanha-ultrarealista-10s
          path: generated/gato_comendo_lasanha_ultrarealista_10s.mp4
          if-no-files-found: error

      - name: Commit MP4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/gato_comendo_lasanha_ultrarealista_10s.mp4
          if git diff --cached --quiet; then
            echo 'MP4 already stored.'
          else
            git commit -m 'Store LTX 2.5 cat lasagna ultra realistic 10s MP4'
            git push
          fi
